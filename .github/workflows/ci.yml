name: test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
      - run: python -m pip install -c constraints.txt '.[test,ocr,nlp]'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/frontend.test.cjs
      - run: ruff check . && ruff format --check .
      - run: pytest --cov=app --cov-report=term-missing
      - run: docker build --target production -t enterprise-cv-parser .
