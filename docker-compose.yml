services:
  cv-parser-api:
    build:
      context: .
      target: production
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      MAX_UPLOAD_SIZE_MB: "15"
      USE_LLM_FALLBACK: "false"
      OCR_LANGUAGES: "eng+aze+tur+rus"
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 128
    restart: unless-stopped
