[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-cv-parser"
version = "1.0.0"
description = "Evidence-preserving multilingual PDF resume parsing API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
 "pydantic>=2.9,<3", "pydantic-settings>=2.5,<3",
 "pymupdf>=1.24,<2", "pdfplumber>=0.11,<1",
 "dateparser>=1.2,<2", "phonenumbers>=8.13,<10",
 "rapidfuzz>=3.9,<4", "loguru>=0.7,<1",
 "python-multipart>=0.0.20,<1", "httpx>=0.28,<1"
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.11,<1", "reportlab>=4,<5"]
ocr = ["pytesseract>=0.3.13,<1", "pillow>=11,<13"]
nlp = ["spacy>=3.8,<4", "lingua-language-detector>=2,<3"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.data-files]
"share/enterprise-cv-parser" = ["index.html"]

[tool.vercel]
entrypoint = "app.main:app"
